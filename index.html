<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF改行整理ツール</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid #e0e0e0;
        }
        h1 {
            text-align: center;
            color: #007bff;
            margin-bottom: 30px;
            font-weight: 600;
        }
        .io-wrapper {
            display: flex;
            justify-content: space-between;
            gap: 20px; /* テキストエリア間の隙間 */
            margin-bottom: 25px;
        }
        .io-wrapper > div {
            flex: 1; /* 各テキストエリアが均等な幅を占める */
            display: flex;
            flex-direction: column;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 1.1em;
        }
        textarea {
            width: 100%;
            height: 350px;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 1em;
            resize: vertical; /* 縦方向のみリサイズ可能 */
            box-sizing: border-box; /* paddingとborderをwidthに含める */
            font-family: 'Meiryo UI', 'Consolas', monospace; /* 見やすいフォント */
        }
        textarea:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
            outline: none;
        }
        .controls {
            text-align: center;
            margin-top: 20px;
            padding: 15px 0;
            background-color: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        .controls label {
            display: inline-block; /* 横並びにするため */
            margin-right: 10px;
            font-size: 1.0em;
        }
        input[type="number"] {
            padding: 10px;
            width: 70px; /* 数字入力欄の幅を調整 */
            border: 1px solid #ced4da;
            border-radius: 6px;
            text-align: center;
            font-size: 1em;
            margin: 0 5px; /* ラベルとの間隔 */
        }
        button {
            padding: 12px 25px;
            background-color: #28a745; /* 実行ボタンは緑色に */
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            transition: background-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            margin-left: 20px;
        }
        button:hover {
            background-color: #218838; /* ホバーで少し濃く */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        @media (max-width: 768px) {
            .io-wrapper {
                flex-direction: column;
            }
            .io-wrapper > div {
                width: 100%;
            }
            .controls {
                flex-direction: column;
                align-items: center;
            }
            .controls label,
            .controls input,
            .controls span {
                display: block;
                margin-bottom: 10px;
                text-align: center;
            }
            button {
                margin-left: 0;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PDFからコピペした文章の改行を整理</h1>
        
        <div class="io-wrapper">
            <div>
                <label for="inputTextArea">入力テキスト (PDFから貼り付け)</label>
                <textarea id="inputTextArea" placeholder="ここにPDFからコピーした文章を貼り付けてください。"></textarea>
            </div>
            <div>
                <label for="outputTextArea">出力テキスト</label>
                <textarea id="outputTextArea" readonly placeholder="変換結果がここに表示されます。"></textarea>
            </div>
        </div>

        <div class="controls">
            <label>
                <input type="number" id="startCharCountInput" value="28" min="1">
                <span>文字目～</span>
                <input type="number" id="endCharCountInput" value="30" min="1">
                <span>文字目ごとの直後の改行を削除</span>
            </label>
            <button onclick="removePdfLineBreaks()">実行</button>
        </div>
    </div>

    <!-- JavaScriptファイルをここで読み込む -->
    <script src="script.js"></script>
</body>
</html>
