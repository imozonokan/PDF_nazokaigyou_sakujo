<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テキスト改行調整ツール</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        /* 文字数カウントエリア */
        .count-section {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
            position: relative;
        }
        .count-header {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .max-count-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #007bff;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .line-counts-list {
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.85rem;
            color: #666;
            background: #f1f1f1;
            padding: 10px;
            border-radius: 4px;
        }
        /* 設定エリア */
        .settings-section {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .settings-section label {
            font-weight: bold;
            margin-right: 10px;
        }
        .settings-section input[type="number"] {
            width: 70px;
            padding: 5px;
            margin: 0 5px;
        }
        /* 置換設定エリア */
        .rule-row {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            background: #fdfdfd;
            border: 1px dashed #ccc;
            padding: 8px 12px;
            border-radius: 4px;
        }
        .rule-field {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .rule-field label {
            font-size: 0.85rem;
            color: #555;
            white-space: nowrap;
        }
        .rule-field input[type="text"] {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 150px;
            font-size: 0.9rem;
        }
        .btn-remove-rule {
            background-color: #dc3545;
            color: white;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .btn-remove-rule:hover {
            background-color: #c82333;
        }
        /* テキストエリア */
        .text-areas {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 768px) {
            .text-areas {
                flex-direction: column;
            }
        }
        .text-box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .text-box label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9rem;
            resize: vertical;
        }
        /* ボタン */
        .btn-container {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .btn-reset {
            background-color: #dc3545;
            color: white;
        }
        .btn-reset:hover {
            background-color: #c82333;
        }
        .btn-copy {
            background-color: #28a745;
            color: white;
        }
        .btn-copy:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. タイトル -->
    <h1>テキスト改行調整ツール</h1>

    <!-- 2. 文字数カウント（スペース削除適用後） -->
    <div class="count-section">
        <div class="count-header">1行ごとの文字数（改行前後のスペース削除後）</div>
        <div class="max-count-badge">
            最大文字数: <span id="maxCount">0</span>
        </div>
        <div class="line-counts-list" id="lineCounts">
            （テキストを入力するとここに各行の文字数が表示されます）
        </div>
    </div>

    <!-- 3. 削除文字数入力 -->
    <div class="settings-section">
        <label for="minChars">改行を削除する行の文字数範囲：</label>
        <input type="number" id="minChars" value="1" min="1">
        <span>文字目 〜</span>
        <input type="number" id="maxChars" value="1" min="1">
        <span>文字目</span>
    </div>

    <!-- 4. 入力＆出力枠 -->
    <div class="text-areas">
        <!-- 入力エリア -->
        <div class="text-box">
            <label for="inputText">入力テキスト</label>
            <textarea id="inputText" placeholder="ここに変換したいテキストを貼り付けてください..."></textarea>
            <div class="btn-container">
                <button class="btn-reset" id="btnReset">入力内容をリセット</button>
            </div>
        </div>
        
        <!-- 出力エリア -->
        <div class="text-box">
            <label for="outputText">出力結果（直接編集可能）</label>
            <textarea id="outputText" placeholder="変換結果がここに表示されます..."></textarea>
            <div class="btn-container">
                <button class="btn-copy" id="btnCopy">出力結果をコピー</button>
            </div>
        </div>
    </div>

    <!-- 5. 単語置換設定 -->
    <div class="settings-section">
        <div style="font-weight: bold; margin-bottom: 10px;">単語置換設定</div>
        <div id="rulesContainer">
            <!-- ルールが動的に追加されます -->
        </div>
        <button type="button" id="btnAddRule" style="background-color: #007bff; color: white; margin-top: 5px; padding: 6px 12px; font-size: 0.85rem;">＋ ルールを追加</button>
    </div>
</div>

<script>
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const minCharsInput = document.getElementById('minChars');
    const maxCharsInput = document.getElementById('maxChars');
    const lineCounts = document.getElementById('lineCounts');
    const maxCount = document.getElementById('maxCount');
    const btnReset = document.getElementById('btnReset');
    const btnCopy = document.getElementById('btnCopy');
    const rulesContainer = document.getElementById('rulesContainer');
    const btnAddRule = document.getElementById('btnAddRule');

    // 正規表現のエスケープ用関数
    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // 置換処理の実行
    function applyReplacements(text) {
        const ruleRows = document.querySelectorAll('.rule-row');
        let processedText = text;

        ruleRows.forEach((row, index) => {
            const beforeVal = row.querySelector('.rule-before').value;
            const afterVal = row.querySelector('.rule-after').value;
            const excludeVal = row.querySelector('.rule-exclude').value;

            if (!beforeVal) return;

            // プレースホルダー用の一時的な接頭辞
            const placeholderPrefix = `___TEMP_RULE_${index}_`;
            let placeholders = [];
            let tempText = processedText;

            // 1. 置換禁止単語を一時的にプレースホルダーに退避
            if (excludeVal) {
                const excludeRegex = new RegExp(escapeRegExp(excludeVal), 'g');
                let matchIndex = 0;
                tempText = tempText.replace(excludeRegex, () => {
                    const ph = `${placeholderPrefix}${matchIndex}___`;
                    placeholders.push({ placeholder: ph, original: excludeVal });
                    matchIndex++;
                    return ph;
                });
            }

            // 2. 置換対象の単語を置換
            const beforeRegex = new RegExp(escapeRegExp(beforeVal), 'g');
            tempText = tempText.replace(beforeRegex, afterVal);

            // 3. 退避した置換禁止単語を復元
            placeholders.forEach(item => {
                tempText = tempText.replace(item.placeholder, item.original);
            });

            processedText = tempText;
        });

        return processedText;
    }

    // ルール行の動的生成
    function createRuleRow(before = '', after = '', exclude = '') {
        const row = document.createElement('div');
        row.className = 'rule-row';

        row.innerHTML = `
            <div class="rule-field">
                <label>置換前:</label>
                <input type="text" class="rule-before" value="${before}" placeholder="例: HO1">
            </div>
            <div class="rule-field">
                <label>置換後:</label>
                <input type="text" class="rule-after" value="${after}" placeholder="例: {HO1}">
            </div>
            <div class="rule-field">
                <label>置換禁止:</label>
                <input type="text" class="rule-exclude" value="${exclude}" placeholder="例: {HO1}">
            </div>
            <button type="button" class="btn-remove-rule">－</button>
        `;

        // 入力値変更時に再処理を実行
        row.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', processText);
        });

        // 削除ボタンのイベント設定
        row.querySelector('.btn-remove-rule').addEventListener('click', () => {
            row.remove();
            processText();
        });

        rulesContainer.appendChild(row);
    }

    // 処理のメインロジック
    function processText() {
        let text = inputText.value;

        if (!text) {
            outputText.value = '';
            updateLineCounts([]);
            return;
        }

        // 単語の置換処理を適用
        text = applyReplacements(text);

        // 1. 改行コードを「α」に一時変換
        const placeholderAlpha = '\uE000';
        let step1 = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\n/g, placeholderAlpha);

        // 2. 「α」の前後の半角スペース・全角スペースをすべて削除
        const spaceRemoveRegex = new RegExp(`[ 　]*${placeholderAlpha}[ 　]*`, 'g');
        let step2 = step1.replace(spaceRemoveRegex, placeholderAlpha);

        // 3. 文頭～α間、α～α間のセグメント（行）に分割し、それぞれの文字数を計算
        const segments = step2.split(placeholderAlpha);
        
        // 文字数カウント表示を更新（スペース削除適用後の各セグメントの文字数を表示します）
        updateLineCounts(segments);

        const minLen = parseInt(minCharsInput.value, 10);
        const maxLen = parseInt(maxCharsInput.value, 10);

        if (isNaN(minLen) || isNaN(maxLen) || minLen > maxLen) {
            // パラメータが不正な場合は、スペース削除処理のみを適用して出力します
            outputText.value = segments.join('\n');
            return;
        }

        // 4. 「改行を削除する行の文字数範囲」に対応する位置にある「α」を削除
        const processedSegments = [];
        for (let i = 0; i < segments.length; i++) {
            processedSegments.push(segments[i]);

            if (i < segments.length - 1) {
                const currentSegmentLength = segments[i].length;
                
                // セグメントの文字数が指定範囲内の場合、結合する
                if (currentSegmentLength >= minLen && currentSegmentLength <= maxLen) {
                    // 結合するため、区切り文字を挿入しない
                } else {
                    // 改行に戻すため、一時文字を挿入する
                    processedSegments.push(placeholderAlpha);
                }
            }
        }

        // 5. 残った「α」を改行に復元して出力
        const finalResult = processedSegments.join('').replace(new RegExp(placeholderAlpha, 'g'), '\n');
        outputText.value = finalResult;
    }

    // 文字数カウント表示の更新
    function updateLineCounts(segments) {
        if (segments.length === 0) {
            lineCounts.innerHTML = '（テキストを入力するとここに各行の文字数が表示されます）';
            maxCount.innerText = '0';
            return;
        }

        let maxLen = 0;
        let htmlContent = '';

        segments.forEach((segment, index) => {
            const len = segment.length;
            if (len > maxLen) {
                maxLen = len;
            }
            htmlContent += `<div>${index + 1}行目: ${len} 文字</div>`;
        });

        lineCounts.innerHTML = htmlContent;
        maxCount.innerText = maxLen;
    }

    // イベントリスナーの登録
    inputText.addEventListener('input', processText);
    minCharsInput.addEventListener('input', processText);
    maxCharsInput.addEventListener('input', processText);

    // ルール追加ボタン
    btnAddRule.addEventListener('click', () => {
        createRuleRow();
        processText();
    });

    // 入力リセット機能（設定値は維持）
    btnReset.addEventListener('click', () => {
        inputText.value = '';
        processText();
    });

    // コピー機能
    btnCopy.addEventListener('click', () => {
        outputText.select();
        try {
            document.execCommand('copy');
            const originalText = btnCopy.textContent;
            btnCopy.textContent = 'コピーしました！';
            setTimeout(() => {
                btnCopy.textContent = originalText;
            }, 2000);
        } catch (err) {
            alert('コピーに失敗しました。手動でコピーしてください。');
        }
    });

    // 初期状態としてルールを1行登録しておく
    createRuleRow();
</script>

</body>
</html>
