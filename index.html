<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テキスト改行調整ツール</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        /* 文字数カウントエリア */
        .count-section {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
            position: relative;
        }
        .count-header {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .max-count-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #007bff;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .line-counts-list {
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.85rem;
            color: #666;
            background: #f1f1f1;
            padding: 10px;
            border-radius: 4px;
        }
        /* 設定エリア */
        .settings-section {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .settings-section label {
            font-weight: bold;
            margin-right: 10px;
        }
        .settings-section input[type="number"] {
            width: 70px;
            padding: 5px;
            margin: 0 5px;
        }
        /* テキストエリア */
        .text-areas {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 768px) {
            .text-areas {
                flex-direction: column;
            }
        }
        .text-box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .text-box label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9rem;
            resize: vertical;
        }
        /* ボタン */
        .btn-container {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .btn-reset {
            background-color: #dc3545;
            color: white;
        }
        .btn-reset:hover {
            background-color: #c82333;
        }
        .btn-copy {
            background-color: #28a745;
            color: white;
        }
        .btn-copy:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. タイトル -->
    <h1>テキスト改行調整ツール</h1>

    <!-- 2. 文字数カウント -->
    <div class="count-section">
        <div class="count-header">1行ごとの文字数</div>
        <div class="max-count-badge">
            最大文字数: <span id="maxCount">0</span>
        </div>
        <div class="line-counts-list" id="lineCounts">
            （テキストを入力するとここに各行の文字数が表示されます）
        </div>
    </div>

    <!-- 3. 削除文字数入力 -->
    <div class="settings-section">
        <label for="minChars">改行を削除する行の文字数範囲：</label>
        <input type="number" id="minChars" value="28" min="1">
        <span>文字目 〜</span>
        <input type="number" id="maxChars" value="30" min="1">
        <span>文字目</span>
    </div>

    <!-- 4. 入力＆出力枠 -->
    <div class="text-areas">
        <!-- 入力エリア -->
        <div class="text-box">
            <label for="inputText">入力テキスト</label>
            <textarea id="inputText" placeholder="ここに変換したいテキストを貼り付けてください..."></textarea>
            <div class="btn-container">
                <button class="btn-reset" id="btnReset">入力内容をリセット</button>
            </div>
        </div>
        
        <!-- 出力エリア -->
        <div class="text-box">
            <label for="outputText">出力結果（直接編集可能）</label>
            <textarea id="outputText" placeholder="変換結果がここに表示されます..."></textarea>
            <div class="btn-container">
                <button class="btn-copy" id="btnCopy">出力結果をコピー</button>
            </div>
        </div>
    </div>
</div>

<script>
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const minCharsInput = document.getElementById('minChars');
    const maxCharsInput = document.getElementById('maxChars');
    const lineCounts = document.getElementById('lineCounts');
    const maxCount = document.getElementById('maxCount');
    const btnReset = document.getElementById('btnReset');
    const btnCopy = document.getElementById('btnCopy');

    // 処理の実行
    function processText() {
        const text = inputText.value;
        const minLen = parseInt(minCharsInput.value, 10);
        const maxLen = parseInt(maxCharsInput.value, 10);

        // 1. 各行の文字数カウントの更新
        updateLineCounts(text);

        if (isNaN(minLen) || isNaN(maxLen) || minLen > maxLen) {
            outputText.value = text;
            return;
        }

        // 改行コードを標準化
        const normalizedText = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        
        // 元のアルゴリズムに準拠した処理：
        // 全ての改行を「α」に置き換える。ここでは配列の要素間の区切りとして表現します。
        const lines = normalizedText.split('\n');
        const processedParts = [];

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            processedParts.push(line);

            // 最終行以外について、その直後に改行（α）が存在する
            if (i < lines.length - 1) {
                const currentLineLength = line.length;
                // 改行直前の文字（＝行の末尾）が、指定された「文字数」の範囲内であるか判定
                if (currentLineLength >= minLen && currentLineLength <= maxLen) {
                    // 範囲内の場合は、直後の改行（α）を削除（＝何も追加しない）
                } else {
                    // 範囲外の場合は、改行（α）を維持する（＝改行コードを追加）
                    processedParts.push('\n');
                }
            }
        }

        outputText.value = processedParts.join('');
    }

    // 文字数カウント表示の更新
    function updateLineCounts(text) {
        if (!text) {
            lineCounts.innerHTML = '（テキストを入力するとここに各行の文字数が表示されます）';
            maxCount.innerText = '0';
            return;
        }

        const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
        let maxLen = 0;
        let htmlContent = '';

        lines.forEach((line, index) => {
            const len = line.length;
            if (len > maxLen) {
                maxLen = len;
            }
            htmlContent += `<div>${index + 1}行目: ${len} 文字</div>`;
        });

        lineCounts.innerHTML = htmlContent;
        maxCount.innerText = maxLen;
    }

    // イベントリスナーの登録
    inputText.addEventListener('input', processText);
    minCharsInput.addEventListener('input', processText);
    maxCharsInput.addEventListener('input', processText);

    // 入力リセット機能（設定値は維持）
    btnReset.addEventListener('click', () => {
        inputText.value = '';
        processText();
    });

    // コピー機能
    btnCopy.addEventListener('click', () => {
        outputText.select();
        try {
            document.execCommand('copy');
            const originalText = btnCopy.textContent;
            btnCopy.textContent = 'コピーしました！';
            setTimeout(() => {
                btnCopy.textContent = originalText;
            }, 2000);
        } catch (err) {
            alert('コピーに失敗しました。手動でコピーしてください。');
        }
    });
</script>

</body>
</html>
