<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テキスト改行調整ツール</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        /* 文字数カウントエリア */
        .count-section {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
            position: relative;
        }
        .count-header {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .max-count-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #007bff;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .line-counts-list {
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.85rem;
            color: #666;
            background: #f1f1f1;
            padding: 10px;
            border-radius: 4px;
        }
        /* 設定エリア */
        .settings-section {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .settings-section label {
            font-weight: bold;
            margin-right: 10px;
        }
        .settings-section input[type="number"] {
            width: 70px;
            padding: 5px;
            margin: 0 5px;
        }
        /* テキストエリア */
        .text-areas {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 768px) {
            .text-areas {
                flex-direction: column;
            }
        }
        .text-box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .text-box label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9rem;
            resize: vertical;
        }
        /* ボタン */
        .btn-container {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .btn-reset {
            background-color: #dc3545;
            color: white;
        }
        .btn-reset:hover {
            background-color: #c82333;
        }
        .btn-copy {
            background-color: #28a745;
            color: white;
        }
        .btn-copy:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. タイトル -->
    <h1>テキスト改行調整ツール</h1>

    <!-- 2. 文字数カウント（スペース削除適用後） -->
    <div class="count-section">
        <div class="count-header">1行ごとの文字数（改行前後のスペース削除後）</div>
        <div class="max-count-badge">
            最大文字数: <span id="maxCount">0</span>
        </div>
        <div class="line-counts-list" id="lineCounts">
            （テキストを入力するとここに各行の文字数が表示されます）
        </div>
    </div>

    <!-- 3. 削除文字数入力（初期値を空欄に変更） -->
    <div class="settings-section">
        <label for="minChars">改行を削除する行の文字数範囲：</label>
        <input type="number" id="minChars" min="1" placeholder="例: 28">
        <span>文字目 〜</span>
        <input type="number" id="maxChars" min="1" placeholder="例: 30">
        <span>文字目</span>
    </div>

    <!-- 4. 入力＆出力枠 -->
    <div class="text-areas">
        <!-- 入力エリア -->
        <div class="text-box">
            <label for="inputText">入力テキスト</label>
            <textarea id="inputText" placeholder="ここに変換したいテキストを貼り付けてください..."></textarea>
            <div class="btn-container">
                <button class="btn-reset" id="btnReset">入力内容をリセット</button>
            </div>
        </div>
        
        <!-- 出力エリア -->
        <div class="text-box">
            <label for="outputText">出力結果（直接編集可能）</label>
            <textarea id="outputText" placeholder="変換結果がここに表示されます..."></textarea>
            <div class="btn-container">
                <button class="btn-copy" id="btnCopy">出力結果をコピー</button>
            </div>
        </div>
    </div>
</div>

<script>
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const minCharsInput = document.getElementById('minChars');
    const maxCharsInput = document.getElementById('maxChars');
    const lineCounts = document.getElementById('lineCounts');
    const maxCount = document.getElementById('maxCount');
    const btnReset = document.getElementById('btnReset');
    const btnCopy = document.getElementById('btnCopy');

    // 処理のメインロジック
    function processText() {
        const text = inputText.value;
        const minLen = parseInt(minCharsInput.value, 10);
        const maxLen = parseInt(maxCharsInput.value, 10);

        if (!text) {
            outputText.value = '';
            updateLineCounts([]);
            return;
        }

        // 1. 改行コードを「α」に一時変換
        const placeholderAlpha = '\uE000';
        let step1 = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\n/g, placeholderAlpha);

        // 2. 「α」の前後の半角スペース・全角スペースをすべて削除
        const spaceRemoveRegex = new RegExp(`[ 　]*${placeholderAlpha}[ 　]*`, 'g');
        let step2 = step1.replace(spaceRemoveRegex, placeholderAlpha);

        // 3. 文頭～α間、α～α間のセグメント（行）に分割し、それぞれの文字数を計算
        const segments = step2.split(placeholderAlpha);
        
        // 文字数カウント表示を更新
        updateLineCounts(segments);

        // 範囲指定（minLen、maxLen）が未入力、または正しくない場合はスペース削除のみを行い改行を復元
        if (isNaN(minLen) || isNaN(maxLen) || minLen > maxLen) {
            outputText.value = segments.join('\n');
            return;
        }

        // 4. 指定範囲内の文字数の直後にある「α」を「β」とみなして削除
        const processedSegments = [];
        for (let i = 0; i < segments.length; i++) {
            processedSegments.push(segments[i]);

            if (i < segments.length - 1) {
                const currentSegmentLength = segments[i].length;
                
                // 指定範囲内の場合、結合処理（改行用一時文字を追加しない）
                if (currentSegmentLength >= minLen && currentSegmentLength <= maxLen) {
                    // βとして削除
                } else {
                    // αとして維持
                    processedSegments.push(placeholderAlpha);
                }
            }
        }

        // 5. 残った「α」を改行に復元して出力
        const finalResult = processedSegments.join('').replace(new RegExp(placeholderAlpha, 'g'), '\n');
        outputText.value = finalResult;
    }

    // 文字
