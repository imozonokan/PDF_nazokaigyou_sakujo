<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF改行削除ツール</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #0056b3;
        }
textarea {
                width: calc(50% - 15px); /* 画面を2分割、間に少し隙間 */
                height: 300px;
                padding: 10px;
                margin: 5px;
                border: 1px solid #ddd;
                border-radius: 4px;
                vertical-align: top;
                box-sizing: border-box;
            }
            .io-wrapper { /* これも追加または修正 */
                display: flex;
                justify-content: space-around; /* 間隔を広めに */
                margin-bottom: 10px;
            }
            .io-wrapper > div { /* これも追加または修正 */
                width: 48%; /* 各テキストエリアの幅を調整 */
            }
            .controls input[type="number"] { /* 数字入力欄の幅を調整 */
                width: 60px; /* 数字入力欄の幅を小さく */
                text-align: center;
            }
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        input[type="number"] {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-right: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .io-wrapper {
            display: flex; /* テキストエリアを横並びにする */
            justify-content: space-between;
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PDF改行削除ツール</h1>
        
        <div class="io-wrapper">
            <div>
                <label for="inputTextArea">入力テキスト (PDFから貼り付け)</label>
                <textarea id="inputTextArea" placeholder="ここにPDFからコピーした文章を貼り付けてください。"></textarea>
            </div>
            <div>
                <label for="outputTextArea">出力テキスト</label>
                <textarea id="outputTextArea" readonly placeholder="変換結果がここに表示されます。"></textarea>
            </div>
        </div>

<div class="controls">
                <label for="startCharCountInput">改行を削除する範囲:</label>
                <input type="number" id="startCharCountInput" value="28" min="1">
                <span>文字目～</span>
                <input type="number" id="endCharCountInput" value="30" min="1">
                <span>文字目ごとの改行を削除</span>
                <button onclick="removePdfLineBreaks()">実行</button>
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
